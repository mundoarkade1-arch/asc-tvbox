name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar o app
        run: gradle assembleRelease --no-daemon

      - name: Assinar o APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.keystore
            echo "HAS_KEY=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Sem chave nos Secrets. APK so para teste: nao sera publicado."
            keytool -genkeypair -keystore release.keystore -storepass android -keypass android -alias key0 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ASC TV Box teste"
            KS_PASS=android; KS_ALIAS=key0; KEY_PASS=android
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          IN=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          "$BT/zipalign" -p 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-key-alias "$KS_ALIAS" --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" --out ASC-TVBox.apk aligned.apk
          "$BT/apksigner" verify --print-certs ASC-TVBox.apk
          rm -f release.keystore aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ASC-TVBox-apk
          path: ASC-TVBox.apk

      - name: Publicar em Releases (para baixar o APK)
        if: env.HAS_KEY == 'true' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION_CODE}"
          gh release create "$TAG" ASC-TVBox.apk --title "ASC TV Box ${VERSION_NAME}" --notes "Versao ${VERSION_NAME}" --latest
